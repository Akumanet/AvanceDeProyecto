<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MARJEL: tienda de ropa y moda. Proyecto de demostración.">
    <title>Contacto | MARJEL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="aviso">MARJEL · ESTILO PARA CADA DÍA</div>
    <header class="contenedor">
        <div class="barra">
            <a class="logo" href="index.html">MARJEL</a>
            <nav class="navegacion" aria-label="Menú principal">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="ofertas.html">Ofertas</a>
                <a href="ubicacion.html">Ubicación</a>
                <a href="contacto.html" aria-current="page">Contacto</a>
            </nav>
        </div>
    </header>
    <main class="contenedor">
        <div class="encabezado-pagina">
            <span class="etiqueta">Estamos para ayudarte</span>
            <h1>Contacto</h1>
            <p>¿Tienes dudas sobre una prenda? Marcanos al <strong><em>+52 1 786 131 3423</em></strong> o Escríbenos.</p>
        </div>
        <section class="seccion">
            <form class="formulario">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Aqui escribe tu nombre...">
                </div>
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Aqui escribe tucorreo@ejemplo.com">
                </div>
                <div class="campo">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="¿En qué podemos ayudarte?">
                </div>
                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí"></textarea>
                </div>
                <button class="boton" type="button">Enviar mensaje</button>
                
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="contenedor barra">
            <a class="logo" href="index.html">MARJEL</a>
            <div>
                <p>MARJEL · ESTILO PARA CADA DÍA</p>
            </div>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
